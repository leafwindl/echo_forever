<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Echo AI</title>
  <meta name="description" content="Echo AI 伴侣服务页" />
  <style>
    :root {
      color-scheme: light;
      --text: #202124;
      --muted: #646a73;
      --line: #e7e8ec;
      --accent: #d94f70;
      --bg: #fbfbfd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        sans-serif;
    }

    main {
      min-height: calc(100vh - 72px);
      display: grid;
      place-items: center;
      padding: 32px 20px;
      text-align: center;
    }

    .brand {
      width: min(100%, 560px);
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.05;
      font-weight: 720;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.7;
    }

    .mark {
      display: inline-grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin-bottom: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      color: var(--accent);
      font-size: 26px;
      font-weight: 700;
    }

    footer {
      min-height: 72px;
      display: grid;
      place-items: center;
      padding: 16px;
      border-top: 1px solid var(--line);
      background: #fff;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: var(--accent);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <section class="brand" aria-labelledby="site-title">
      <div class="mark" aria-hidden="true">E</div>
      <h1 id="site-title">Echo AI</h1>
      <p>服务建设中</p>
    </section>
  </main>
  <footer>
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">
      鄂ICP备2026034314号
    </a>
  </footer>
</body>
</html>
