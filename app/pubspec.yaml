name: echo_app
description: Echo mobile application.
publish_to: none
version: 1.0.0+2

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.9
  dio: ^5.11.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.3.1
