  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  logging: ^1.3.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.0
  record: ^7.1.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.1
