name: echo_app
description: Echo mobile application.
publish_to: none
version: 1.1.9+25

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  audio_session: ^0.2.4
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.9
  dio: ^5.11.0
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^10.3.1
  flutter_local_notifications: ^22.3.0
  go_router: ^17.3.0
  getuiflut:
    path: third_party/getuiflut
  image_picker: ^1.2.3
