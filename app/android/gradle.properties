org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Local Clash proxy for Google/Cloudflare sources that fall back off mirrors
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
# Kotlin incremental compilation breaks on cross-drive paths (pub cache on C:, project on F:)
kotlin.incremental=false
# FCM release setup: set true only after android/app/google-services.json exists.
echo.enableFirebase=false
