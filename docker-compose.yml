services:
  echo-postgres:
    image: pgvector/pgvector:pg16
    container_name: echo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-echo}
      POSTGRES_USER: ${POSTGRES_USER:-echo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echo_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - echo-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  echo-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echo-backend
    env_file:
      - Echo-backend/.env
    environment:
      DB_PROVIDER: postgres
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://echo:echo_dev_password@echo-postgres:5432/echo}
      MELOTTS_BASE_URL: http://echo-melotts:9000
      FUNASR_WS_URL: ws://echo-funasr:10095
    depends_on:
      echo-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./Echo-backend/static:/app/Echo-backend/static
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  echo-melotts:
    profiles: ["voice-local"]
    build:
      context: .
      dockerfile: deploy/melotts/Dockerfile
    container_name: echo-melotts
    environment:
      MELOTTS_LANGUAGE: ZH
      MELOTTS_DEVICE: cpu
    volumes:
      - echo-melotts-models:/models
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health/ready', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  echo-funasr:
    profiles: ["voice-local"]
    image: ${FUNASR_IMAGE:-registry.cn-hangzhou.aliyuncs.com/funasr_repo/funasr:funasr-runtime-sdk-online-cpu-0.1.13}
    container_name: echo-funasr
    environment:
      FUNASR_MODEL_DIR: /workspace/models
      FUNASR_OFFLINE_MODEL: ${FUNASR_OFFLINE_MODEL:-damo/speech_paraformer-large-vad-punc_asr_nat-zh-cn-16k-common-vocab8404-onnx}
      FUNASR_ONLINE_MODEL: ${FUNASR_ONLINE_MODEL:-damo/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-online-onnx}
      FUNASR_VAD_MODEL: ${FUNASR_VAD_MODEL:-damo/speech_fsmn_vad_zh-cn-16k-common-onnx}
      FUNASR_PUNC_MODEL: ${FUNASR_PUNC_MODEL:-damo/punc_ct-transformer_zh-cn-common-vad_realtime-vocab272727-onnx}
      FUNASR_ITN_MODEL: ${FUNASR_ITN_MODEL:-thuduj12/fst_itn_zh}
      FUNASR_LM_MODEL: ${FUNASR_LM_MODEL:-damo/speech_ngram_lm_zh-cn-ai-wesp-fst}
    volumes:
      - echo-funasr-models:/workspace/models
      - ./deploy/funasr/start.sh:/voice/start.sh:ro
    command: ["/bin/bash", "/voice/start.sh"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  echo-postgres-backup:
    image: pgvector/pgvector:pg16
    container_name: echo-postgres-backup
    environment:
      POSTGRES_HOST: echo-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-echo}
      POSTGRES_USER: ${POSTGRES_USER:-echo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echo_dev_password}
      POSTGRES_BACKUP_DIR: /backups
      POSTGRES_BACKUP_INTERVAL_SECONDS: ${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-7}
    depends_on:
      echo-postgres:
        condition: service_healthy
    volumes:
      - ./data/backups/postgres:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/postgres_backup.sh"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  echo-postgres-data:
  echo-melotts-models:
  echo-funasr-models:
