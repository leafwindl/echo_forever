[project]
name = "echo-desktop"
version = "0.1.0"
description = "Echo Desktop Windows node for approved local computer actions."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "websockets>=15,<16",
    "Pillow>=10,<13",
    "opencv-python-headless>=4.10,<5",
]

[project.scripts]
echo-desktop = "echo_desktop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echo_desktop"]
